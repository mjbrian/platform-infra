version: '3'
tasks:
  ca:trust:
    desc: Trusts the lab CA on macOS, so that TLS connections to the local cluster work without warnings
    cmds:
      - kubectl --context k3d-lab -n cert-manager get secret lab-ca -o jsonpath='{.data.ca\.crt}' | base64 -d > /tmp/lab-ca.crt
      - sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/lab-ca.crt
  ca:untrust:
    desc: Untrusts the lab CA on macOS, so that TLS connections to the local cluster will show warnings again
    cmds:
      - sudo security delete-certificate -c "lab-ca" /Library/Keychains/System.keychain
